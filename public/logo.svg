<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Takwimu">
  <title>Takwimu</title>
  <rect width="64" height="64" rx="14" fill="#0A192F"/>
  <!-- The bar across the top is the whole: a budget, a total, a baseline. -->
  <rect x="13" y="11.5" width="38" height="9" rx="3" fill="#FDFBF5"/>
  <!-- The stem is that whole split into parts, stacked and separated by a gap. -->
  <rect x="27" y="23.5" width="10" height="11" rx="2.5" fill="#FCD34D"/>
  <rect x="27" y="36.5" width="10" height="9" rx="2.5" fill="#F59E0B"/>
  <rect x="27" y="47.5" width="10" height="5.5" rx="2.5" fill="#D97706"/>
</svg>
