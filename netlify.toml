[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# Next.js route payloads (index.txt). Netlify serves .txt as text/plain, and Next then reloads the whole page on every
# internal link instead of navigating client-side; the correct type keeps navigation fast. Sweep 13, 21 Nov 2026.
[[headers]]
  for = "/index.txt"
  [headers.values]
    Content-Type = "text/x-component"

[[headers]]
  for = "/*/index.txt"
  [headers.values]
    Content-Type = "text/x-component"

[[redirects]]
  from = "/corrections/*"
  to = "/data/#conflicts"
  status = 301
  force = true

# The trend explorer moved into the Kenya dashboard (owner de-duplication, 21 Nov 2026). Query strings pass through.
[[redirects]]
  from = "/trends/"
  to = "/kenya/"
  status = 301
  force = true

[[redirects]]
  from = "/trends"
  to = "/kenya/"
  status = 301
  force = true
