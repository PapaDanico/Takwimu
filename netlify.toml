[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'"

# Hashed build assets never change under the same name: cache them for a year (Netlify's default revalidates each visit).
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Next.js route payloads (index.txt). Netlify serves .txt as text/plain, and Next then reloads the whole page on every
# internal link instead of navigating client-side; the correct type keeps navigation fast. Sweep 13, 21 Nov 2026.
[[headers]]
  for = "/index.txt"
  [headers.values]
    Content-Type = "text/x-component"

[[headers]]
  for = "/*/index.txt"
  [headers.values]
    Content-Type = "text/x-component"

# The trend explorer moved into the Kenya dashboard (owner de-duplication, 21 Nov 2026). Query strings pass through.
# The fiscal brief PDF moved beside the reports (sweep N2, 21 Nov 2026). The build keeps a byte-identical copy at the
# old path as the fallback for hosts without this redirect.
[[redirects]]
  from = "/briefs/siaya-fiscal-brief.pdf"
  to = "/reports/siaya-fiscal-brief.pdf"
  status = 301
  force = true

[[redirects]]
  from = "/trends/"
  to = "/kenya/"
  status = 301
  force = true

[[redirects]]
  from = "/trends"
  to = "/kenya/"
  status = 301
  force = true

